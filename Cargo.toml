[package]
name = "socat-rust"
version = "0.1.10"
edition = "2024"
description = "Stable Linux TCP relay for Debian/systemd"
license = "MIT"

[features]
legacy-kernel = []

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
ipnet = { version = "2.11", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
socket2 = "0.6"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time", "io-util"] }
toml = "0.9"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
