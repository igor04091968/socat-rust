# One [[relay]] block per independent socat replacement.
# Run each profile as a separate systemd service under its own UID.

[[relay]]
name = "bnk2450034"
listen = "10.34.0.1:8034"
allow = ["10.19.63.0/24"]
upstream = "172.22.22.34:8000"
uid = 2450034
max_connections = 1
backlog = 1
eof_grace_seconds = 1
# Exact mapping of the currently deployed socat command:
# -t1 => EOF grace 1 second; -v => payload logging enabled.
connect_timeout_seconds = 10
verbose_payload_logging = true
log_file = "/var/log/bnk2450034.log"

[relay.client_keepalive]
