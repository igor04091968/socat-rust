# One [[relay]] block per independent socat replacement.
# Run each profile as a separate systemd service under its own UID.

[[relay]]
name = "bnk2450034"
listen = "10.34.0.1:8034"
allow = ["10.19.63.0/24"]
upstream = "172.22.22.34:8000"
uid = 2450034
max_connections = 1
backlog = 1
eof_grace_seconds = 1
# Exact mapping of the currently deployed socat command:
# -t1 => EOF grace 1 second; -v => payload logging enabled.
connect_timeout_seconds = 10
upstream_retry_window_seconds = 300 # 0 — повторять без ограничения
verbose_payload_logging = true
log_file = "/var/log/bnk2450034.log"

[relay.client_keepalive]
enabled = true
idle_seconds = 15
interval_seconds = 15
count = 8

[relay.upstream_keepalive]
enabled = true
idle_seconds = 150
interval_seconds = 60
count = 2

[relay.resources]
reserve_fds = 32
reserve_memory_bytes = 67108864
memory_per_connection_bytes = 1048576
cpu_pressure_high_percent = 20

